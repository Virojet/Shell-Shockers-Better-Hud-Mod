name: Install counts

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/installs.yml
      - .github/scripts/installs.py

permissions:
  contents: write

concurrency:
  group: install-counts
  cancel-in-progress: false

jobs:
  installs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read the install counters
        run: python3 .github/scripts/installs.py

      - name: Commit counts if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add traffic/installs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update install counts [skip ci]"
          # The daily traffic job also pushes to main; take its commit first.
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
